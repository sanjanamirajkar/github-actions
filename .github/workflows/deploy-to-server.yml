# This will deploy a safe, secure and tested app to production server.

name: Deploy-To-Server

on:
    workflow_call: 

jobs:
  deployment:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME : ${{ vars.DOCKERHUB_USERNAME }}
      DOCKER_TAG: ${{ github.sha }}


    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: SSH to production server & create the folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Installing required packages & folders"
            sudo apt-get update && sudo apt-get install docker.io docker-compose-v2-y
            sudo usermod -aG docker $USER
            mkdir -p DevSecOps

      - name: Copy the docker-compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ~/DevSecOps

      - name: SSH to production server & Run the application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Running application" 
            export DOCKERHUB_USERNAME=${{ vars.DOCKERHUB_USERNAME }}
            export DOCKER_TAG=${{ github.sha }}           
            echo ${{ secrets.DOCKERHUB_TOKEN  }} | docker-login --username ${{ vars.DOCKERHUB_USERNAME }} 
            --password-stdin
            cd ~/DevSecOps && docker compose down && docker compose up -d 
            --build --force-recreate --pull always
      